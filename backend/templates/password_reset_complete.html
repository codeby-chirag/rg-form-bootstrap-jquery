<!-- password_reset_complete.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow text-center">
                    <div class="card-body p-5">
                        <h2 class="text-success mb-3">Success!</h2>
                        <p class="text-muted mb-4">Your password has been set successfully. You may now log in with your new password.</p>
                        <a href="{% url 'login' %}" class="btn btn-success px-4">Log In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
