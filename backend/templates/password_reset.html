<!-- password_reset.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-3">Forgot Password?</h2>
                        <p class="text-muted text-center mb-4 small">Enter your email address below, and we'll send you instructions to reset your password.</p>
                        
                        <form method="post">
                            {% csrf_token %}
                            
                            {% if form.errors %}
                                <div class="alert alert-danger p-2 small">
                                    Please correct the errors below.
                                </div>
                            {% endif %}

                            <div class="mb-3">
                                <label for="id_email" class="form-label">Email Address</label>
                                <input type="email" name="email" id="id_email" required class="form-control" placeholder="email@gmail.com">
                                {% if form.email.errors %}
                                    <div class="text-danger small mt-1">{{ form.email.errors.0 }}</div>
                                {% endif %}
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary">Send Reset Link</button>
                            </div>
                            
                            <div class="text-center mt-3">
                                <a href="{% url 'login' %}" class="text-decoration-none small">Back to Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
