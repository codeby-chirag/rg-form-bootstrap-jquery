<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form Bootstrap</title>
    <link rel="stylesheet" href="{% static 'CSS/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
</head>
<body>
<main class="rs-page-wrapper min-vh-100 d-flex justify-content-center align-items-center py-4 px-5">
    <section class="rs-form-card mw-100 bg-white border-3 rounded-5 border-top-2">
       
    <form action="#" method="get" class="py-4 px-5" id="registrationForm">  
        <h1 class="rs-heading fw-bold py-3">Responsive Registration Form</h1>
        <!-- Email -->
        <div class="rs-form-group mb-2">
            <div class="rs-input-box">
                <i class="fa-regular fa-envelope input-icon position-absolute mt-2 px-2 pt-1 pe-5 ps-3"></i>
                <input 
                    type="email" 
                    class="w-100 rounded-4 border-1 py-1 px-4 ps-5 py-2 form-control" 
                    id="email" 
                    name="email"
                    placeholder="Email"
                    required>
            </div>
            <small class="error-message"></small>
        </div>

        <!-- Password Group -->
        <div class="rs-form-group mb-2">
            <div class="rs-input-box position-relative">
                <i class="fa-solid fa-lock position-absolute top-50 start-0 translate-middle-y ms-3"></i>

                <input type="password" name="password" class="w-100 rounded-4 border-1 py-2 ps-5 pe-5 form-control" id="password" placeholder="Password" required>

                <button type="button" class="eye-btn position-absolute top-50 end-0 translate-middle-y me-3 border-0 bg-transparent">
                    <i class="fa-regular fa-eye text-secondary"></i>
                </button>
            </div>
            <div class="password-strength mt-2">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <small class="error-message">Strong</small>
        </div>

        <!-- Re-type Password -->
        <div class="rs-form-group mb-2">
            <div class="rs-input-box position-relative">
                <i class="fa-solid fa-lock position-absolute top-50 start-0 translate-middle-y ms-3 "></i>

                <input type="password" name="re-password" class="w-100 rounded-4 border-1 py-2 ps-5 pe-5 form-control" id="re-password" placeholder="Password" required>

                <button type="button" class="eye-btn position-absolute top-50 end-0 translate-middle-y me-3 border-0 bg-transparent">
                    <i class="fa-regular fa-eye text-secondary"></i>
                </button>
            </div>
            <small class="error-message">Re-type your password.</small>
        </div>

        <!-- Name Row -->
        <!-- First Name -->
         <div class="rs-form-group mb-2">
            <div class="rs-input-box">
                <input 
                    type="text" 
                    class="w-100 rounded-4 border-1 px-3 py-2 form-control" 
                    id="first-name" 
                    name="firstName"
                    placeholder="First Name"
                    required>
            </div>
            <small class="error-message"></small>
        </div>
        <!-- Last Name -->
        <div class="rs-form-group mb-2">
            <div class="rs-input-box">
                <input 
                    type="text" 
                    class="w-100 rounded-4 border-1 px-3 py-2 form-control" 
                    id="last-name" 
                    name="lastName"
                    placeholder="Last Name"
                    required>
            </div>
            <small class="error-message"></small>
        </div>

        <!-- Mobile Number -->
        <div class="rs-form-group mb-2">
            <div class="rs-input-box">
                <input 
                    type="tel" 
                    class="w-100 rounded-4 border-1 px-3 py-2 form-control" 
                    id="mobile-number" 
                    name="mobileNumber"
                    placeholder="Mobile Number"
                    required>
            </div>
            <small class="error-message"></small>
        </div>

        <!-- Hobbies Checkboxes -->
        <div class="rs-form-group mb-3 mt-2">
            <h5 class="rs-heading2 mb-2">Hobbies</h5>
            <div class="d-flex flex-wrap gap-3">
                <label class="rs-condition">
                    <input class="rs-checkbox-input" type="checkbox" name="hobby" value="cricket">
                    Cricket
                </label>
                <label class="rs-condition">
                    <input class="rs-checkbox-input" type="checkbox" name="hobby" value="football">
                    Football
                </label>
                <label class="rs-condition">
                    <input class="rs-checkbox-input" type="checkbox" name="hobby" value="hockey">
                    Hockey
                </label>
                <label class="rs-condition">
                    <input class="rs-checkbox-input" type="checkbox" name="hobby" value="bowling">
                    Bowling
                </label>
                <label class="rs-condition">
                    <input class="rs-checkbox-input" type="checkbox" name="hobby" value="basketball">
                    Basketball
                </label>
            </div>
        </div>

        <!-- Birth Date -->
        <div class="rs-form-group mb-2">
            <div class="rs-input-box">
                <input 
                    type="date" 
                    class="w-100 rounded-4 border-1 px-3 py-2 form-control text-secondary" 
                    id="birth-date" 
                    name="birthDate"
                    required>
            </div>
            <small class="error-message"></small>
        </div>

        <!-- Gender -->
        <div class="rs-form-group mb-3">
            <h5 class="rs-heading2">Gender</h5>
            <label class="pe-3">
                <input type="radio" name="gender" value="male" id="male" checked>
                Male
            </label>

            <label>
                <input type="radio" name="gender" value="female" id="female">
                Female
            </label>
        </div>

        <!-- Country -->
        <div class="rs-form-group">
            <div class="rs-country-box">
                <i class="fa-solid fa-globe globe-icon position-absolute mt-3 px-1 pe-4 ps-3"></i>

                <select id="country" name="country" class="w-100 px-4 py-3 ps-5 rounded-4 mb-4 form-control">
                    <option value="india" selected>India</option>
                    <option value="australia">Australia</option>
                    <option value="usa">USA</option>
                </select>
            </div>
        </div>

        <!-- Checkboxes -->
        <div class="rs-form-group checkbox-group">
            <label class="rs-condition mb-2">
                <input class="rs-checkbox-input " type="checkbox" checked required>
                I agree with the <a href="#" class="rs-termlink">terms and conditions</a>
            </label>

            <label class="rs-condition mb-3">
                <input class="rs-checkbox-input" type="checkbox">
                I want to receive the newsletter · optional
            </label>
        </div>
        
        <!-- Button -->
        <div class="rs-form-group register-btn">
            <button type="submit" class="submit-btn w-100 border-0 border-warning rounded-4 py-2 bg-warning mb-3">Register</button>
        </div>
    </form>
    
    </section>
</main>
    
<script src="{% static 'JS/jquery-4.0.0.min.js' %}"> </script>
<script src="{% static 'JS/jquery.validate.min.js' %}"> </script>
<script src="{% static 'JS/bootstrap.bundle.min.js' %}"> </script>
<script src="{% static 'JS/script.js' %}"></script>
</body>
</html>
